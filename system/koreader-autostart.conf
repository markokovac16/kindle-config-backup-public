# Start KOReader once the Kindle home screen is up (added 2026-10-25).
# KOReader stops the Amazon framework while it runs and restarts it on exit.
# To disable without SSH: create a file named NO_KOREADER_AUTOSTART in the Kindle's USB drive root.
start on started lab126_gui

task

script
    [ -e /mnt/us/NO_KOREADER_AUTOSTART ] && exit 0
    [ -x /mnt/us/koreader/koreader.sh ] || exit 0
    # Only once per boot: exiting KOReader restarts lab126_gui, which fires this job again.
    [ -e /var/run/koreader-autostarted ] && exit 0
    touch /var/run/koreader-autostarted
    # Wait for the home app, then let it finish drawing.
    lipc-wait-event -s 120 com.lab126.appmgrd appStarted || true
    sleep 4
    pgrep -f reader.lua >/dev/null && exit 0
    cd /mnt/us/koreader
    ( setsid /mnt/us/koreader/koreader.sh --framework_stop >/dev/null 2>&1 & )
end script
